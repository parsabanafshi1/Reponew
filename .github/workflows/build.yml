name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip build.zip
        run: |
          unzip build.zip -d project
          ls -la project

      - name: Fix getFuse() issue
        run: |
          sed -i 's/closest\.getFuse()/closest.fuse/g' project/src/main/java/com/purpleclient/hud/HUDOverlay.java

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3

      - name: Build with Gradle
        working-directory: project
        run: gradle build --stacktrace

      - name: Delete sources jar
        working-directory: project
        run: rm -f build/libs/*-sources.jar

      - name: List remaining jars
        working-directory: project
        run: ls -la build/libs/

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: PurpleClient-Mod
          path: project/build/libs/PurpleClient-1.0.0.jar
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: project/build/libs/PurpleClient-1.0.0.jar
          token: ${{ secrets.GITHUB_TOKEN }}
