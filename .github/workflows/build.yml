name: Build Mod

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        working-directory: PurpleClient
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: PurpleClient
        run: ./gradlew build --stacktrace

      - name: List built jars
        working-directory: PurpleClient
        run: ls -la build/libs/

      - name: Find built jar
        id: find_jar
        working-directory: PurpleClient
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "Selected JAR: $JAR"

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: PurpleClient-Jar
          path: PurpleClient/${{ steps.find_jar.outputs.jar_path }}
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PurpleClient/${{ steps.find_jar.outputs.jar_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
