name: Build Mod

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip build.zip
        run: |
          unzip build.zip -d project
          ls -la project
          ls -la project/PurpleClient

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3

      - name: Build with Gradle
        working-directory: project/PurpleClient
        run: gradle build --stacktrace

      - name: List built jars
        working-directory: project/PurpleClient
        run: ls -la build/libs/

      - name: Find built jar
        id: find_jar
        working-directory: project/PurpleClient
        run: |
          JAR=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "Selected JAR: $JAR"

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: PurpleClient-Jar
          path: project/PurpleClient/${{ steps.find_jar.outputs.jar_path }}
          if-no-files-found: error

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: project/PurpleClient/${{ steps.find_jar.outputs.jar_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
